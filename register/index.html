<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SnailAI Student AI Project Showcase — Registration</title>
<style>
  :root {
    --green-dark: #0D4F3C;
    --green-mid: #1A7B5C;
    --green-light: #E8F5EE;
    --green-pale: #F2FAF6;
    --gold: #D4A843;
    --gold-light: #FFF8E7;
    --ink: #1A2E28;
    --ink-light: #2D4A40;
    --muted: #5A7268;
    --bg: var(--green-pale);
    --card: #FFFFFF;
    --border: #C8DDD2;
    --success: #16A34A;
    --radius: 14px;
    --shadow: 0 4px 24px rgba(13,79,60,0.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
  body {
    font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-feature-settings: 'kern' 1, 'liga' 1;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ===== Header ===== */
  .header {
    width: 100%;
    background: linear-gradient(160deg, var(--green-dark) 0%, var(--green-mid) 50%, #2A9D70 100%);
    padding: 36px 20px 28px;
    text-align: center;
    color: white;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -60%;
    right: -30%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
    border-radius: 50%;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -40%;
    left: -20%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(212,168,67,0.12) 0%, transparent 70%);
    border-radius: 50%;
  }
  .header-inner { position: relative; z-index: 1; }
  .header .logo {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    opacity: 0.95;
  }
  .header .logo .ai { color: var(--gold); }
  .header .event-title {
    font-family: 'Noto Serif SC', 'Inter', serif;
    font-size: 22px;
    font-weight: 900;
    margin-top: 14px;
    letter-spacing: 1px;
    line-height: 1.35;
  }
  .header .event-title-en {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.75;
    margin-top: 6px;
  }
  .header .event-date {
    font-size: 15px;
    font-weight: 600;
    margin-top: 14px;
    opacity: 0.95;
  }
  .header .event-time {
    font-size: 13px;
    margin-top: 4px;
    opacity: 0.8;
  }

  /* ===== Container ===== */
  .container {
    width: 100%;
    max-width: 480px;
    padding: 24px 18px 48px;
    flex: 1;
  }

  /* ===== Notice Banner ===== */
  .notice-banner {
    background: linear-gradient(135deg, var(--gold-light), #FFFBF0);
    border: 1px solid rgba(212,168,67,0.3);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 20px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    box-shadow: 0 2px 12px rgba(212,168,67,0.08);
  }
  .notice-banner .icon { font-size: 18px; line-height: 1.4; flex-shrink: 0; }
  .notice-banner .text {
    font-size: 13px;
    color: #8B6914;
    line-height: 1.55;
    font-weight: 500;
  }
  .notice-banner .text strong { color: #6B5200; }

  /* ===== Card ===== */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    border: 1px solid rgba(13,79,60,0.06);
  }
  .card h2 {
    font-family: 'Noto Serif SC', 'Inter', serif;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--green-dark);
    text-align: center;
    position: relative;
    padding-bottom: 14px;
  }
  .card h2::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 3px;
    background: linear-gradient(90deg, var(--green-mid), var(--gold));
    border-radius: 2px;
  }

  /* ===== Form ===== */
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-light);
    margin-bottom: 6px;
  }
  .form-group label .en {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
    margin-left: 4px;
  }
  .form-group label .required { color: #DC2626; }
  .form-group input, .form-group select {
    width: 100%;
    padding: 13px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    color: var(--ink);
    background: var(--green-pale);
    transition: border-color 0.25s, box-shadow 0.25s;
    -webkit-appearance: none;
  }
  .form-group input:focus, .form-group select:focus {
    outline: none;
    border-color: var(--green-mid);
    box-shadow: 0 0 0 3px rgba(26,123,92,0.12);
  }
  .form-group input::placeholder { color: #9CB8AA; }

  /* ===== Button ===== */
  .btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
    margin-top: 6px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
    color: white;
    box-shadow: 0 4px 16px rgba(13,79,60,0.25);
  }
  .btn-primary:hover:not(:disabled) {
    box-shadow: 0 6px 24px rgba(13,79,60,0.35);
    transform: translateY(-1px);
  }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-primary:active:not(:disabled) { transform: scale(0.98); }

  /* ===== Result Card ===== */
  .result-card {
    text-align: center;
    padding: 40px 24px;
  }
  .result-card .icon { font-size: 52px; margin-bottom: 14px; }
  .result-card h3 { font-family: 'Noto Serif SC', 'Inter', serif; font-size: 21px; font-weight: 700; margin-bottom: 10px; color: var(--green-dark); }
  .result-card p { font-size: 14px; color: var(--muted); line-height: 1.65; }

  /* ===== Error ===== */
  .error-msg {
    background: #FEF2F2;
    border: 1px solid #FCA5A5;
    color: #DC2626;
    padding: 11px 15px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
  }
  .error-msg.show { display: block; }

  .hidden { display: none !important; }

  /* ===== Footer ===== */
  footer {
    width: 100%;
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--muted);
  }

  /* ===== Responsive ===== */
  @media (max-width: 380px) {
    .header { padding: 28px 16px 22px; }
    .header .event-title { font-size: 19px; }
    .container { padding: 18px 14px 40px; }
    .card { padding: 20px 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">snail<span class="ai">AI.ai</span></div>
    <div class="event-title">蜗牛AI应用教育学院<br>第一期学员AI项目毕业展示会</div>
    <div class="event-title-en">SnailAI Academy · 1st Student AI Project Showcase</div>
    <div class="event-date">📍 9月26日（周六）· Killara Golf Club</div>
    <div class="event-time">⏰ 1:30 PM – 5:30 PM</div>
  </div>
</div>

<div class="container">
  <!-- 登记表单 -->
  <div id="form-view">

    <div class="notice-banner">
      <span class="icon">💻</span>
      <span class="text"><strong>温馨提示 / Note:</strong><br>免费安装龙虾，请把您的笔记本电脑带过来<br>Free SnailAI setup — please bring your laptop</span>
    </div>

    <div class="card" id="visitor-form">
      <h2>报名登记<br><span style="font-size:12px;font-weight:500;color:var(--muted);letter-spacing:1px">REGISTRATION</span></h2>

      <div class="error-msg" id="visitor-error"></div>

      <div class="form-group">
        <label>姓名 <span class="required">*</span> <span class="en">Name</span></label>
        <input type="text" id="v-name" placeholder="请输入您的姓名 / Your name" maxlength="50">
      </div>

      <div class="form-group">
        <label>手机号 <span class="required">*</span> <span class="en">Mobile</span></label>
        <input type="tel" id="v-phone" placeholder="04xx xxx xxx" maxlength="20">
      </div>

      <div class="form-group">
        <label>微信号 <span class="en">WeChat (optional)</span></label>
        <input type="text" id="v-wechat" placeholder="选填 / Optional" maxlength="50">
      </div>

      <div class="form-group">
        <label>邮箱 <span class="en">Email (optional)</span></label>
        <input type="email" id="v-email" placeholder="选填 / Optional" maxlength="100">
      </div>

      <div class="form-group">
        <label>公司/机构 <span class="en">Company (optional)</span></label>
        <input type="text" id="v-company" placeholder="选填 / Optional" maxlength="100">
      </div>

      <div class="form-group">
        <label>携伴人数（含自己）<span class="en">Guests (incl. yourself)</span></label>
        <input type="number" id="v-headcount" value="1" min="1" max="10">
      </div>

      <button class="btn btn-primary" id="v-submit" onclick="submitVisitor()">提交登记 / Submit</button>
    </div>
  </div>

  <!-- 成功结果 -->
  <div id="result-view" class="hidden">
    <div class="card result-card" id="result-content"></div>
  </div>
</div>

<footer>&copy; 2026 SnailAI.AI &middot; 蜗牛AI应用教育学院</footer>

<script>
const API = '/api/grad-registrations';

// 解析 URL 参数中的 ref_code（静默关联，不显示横幅）
const urlParams = new URLSearchParams(window.location.search);
const refCode = urlParams.get('ref_code') || '';

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 6000);
}

function showResult(html) {
  document.getElementById('form-view').classList.add('hidden');
  document.getElementById('result-view').classList.remove('hidden');
  document.getElementById('result-content').innerHTML = html;
}

async function submitVisitor() {
  const name = document.getElementById('v-name').value.trim();
  const phone = document.getElementById('v-phone').value.trim();
  if (!name || !phone) {
    showError('visitor-error', '请填写姓名和手机号 / Please fill in name and mobile');
    return;
  }

  const btn = document.getElementById('v-submit');
  btn.disabled = true;
  btn.textContent = '提交中... / Submitting...';

  try {
    const res = await fetch(API + '/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        name,
        phone,
        wechat: document.getElementById('v-wechat').value.trim(),
        email: document.getElementById('v-email').value.trim(),
        company: document.getElementById('v-company').value.trim(),
        interest: '',
        headcount: parseInt(document.getElementById('v-headcount').value) || 1,
        ref_code: refCode || ''
      })
    });
    const data = await res.json();

    if (res.ok) {
      showResult(`
        <div class="icon">✅</div>
        <h3>登记成功！<br><span style="font-size:14px;font-weight:500;color:var(--muted)">Registered Successfully!</span></h3>
        <p>感谢您报名参加第一期学员AI项目毕业展示会<br>Thank you for registering for SnailAI 1st Student AI Project Showcase<br>我们将在活动前发送详细通知 / We'll send details before the event</p>
        <p style="margin-top:14px;font-size:12px;color:var(--muted)">登记编号 / Reg #: <strong>#${data.id}</strong></p>
      `);
    } else if (res.status === 409) {
      showResult(`
        <div class="icon">ℹ️</div>
        <h3>您已登记<br><span style="font-size:14px;font-weight:500;color:var(--muted)">Already Registered</span></h3>
        <p>该手机号已完成登记，无需重复提交<br>This mobile number is already registered<br>9月26日我们在 KGC 见！/ See you at KGC on Sep 26!</p>
      `);
    } else {
      showError('visitor-error', data.error || '提交失败，请重试 / Submission failed, please retry');
    }
  } catch (e) {
    showError('visitor-error', '网络错误，请检查连接后重试 / Network error, please check connection');
  } finally {
    btn.disabled = false;
    btn.textContent = '提交登记 / Submit';
  }
}
</script>
</body>
</html>
