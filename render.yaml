services:
  - type: web
    name: snailai-portal-1
    runtime: python
    region: singapore
    plan: starter
    branch: main
    rootDir: server
    buildCommand: pip install -r requirements.txt
    # 多 worker 安全：限流已改为 SQLite 持久化（rate_limits 表），跨 worker 共享状态；
    # 当前 Starter 计划单实例多 worker 足够，未来可继续调大 -w 数。
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT --timeout 120 app:app
    healthCheckPath: /
    disk:
      name: snailai-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/snailai.db
      - key: PYTHON_VERSION
        value: "3.13"
      - key: WECHAT_WEBHOOK_URL
        sync: false
      - key: YUANQI_APPKEY
        sync: false
      - key: YUANQI_APPID
        sync: false
      - key: CHAT_DAILY_BUDGET
        value: "400"
      - key: CHAT_MAX_CONCURRENT
        value: "8"
      - key: AI_TIMEOUT_SECONDS
        value: "25"

# deployed on Starter plan with persistent disk
