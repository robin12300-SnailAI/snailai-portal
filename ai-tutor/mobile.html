<!DOCTYPE html>
<html lang="zh-CN" data-title-zh="蜗牛AI · AI 助教" data-title-en="SnailAI · AI Tutor">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>蜗牛AI · AI 助教</title>
<meta name="description" content="蜗牛AI助教 — 基于课程知识库的AI问答助手" />
<style>
  :root {
    --ink: #1A1A2E;
    --ink-2: #2A2A40;
    --ink-3: #6A6A85;
    --paper: #FCFCFA;
    --paper-2: #F5F4EE;
    --paper-3: #E8E7E0;
    --accent: #FF5B1F;
    --accent-2: #E84A0F;
    --accent-light: rgba(255,91,31,0.08);
    --accent-warm: #FFF5EE;
    --green: #10b981;
    --line: rgba(26,26,46,0.08);
    --shadow-sm: 0 1px 3px rgba(26,26,46,0.04), 0 2px 8px rgba(26,26,46,0.04);
    --shadow-md: 0 4px 16px rgba(26,26,46,0.08);
    --r-md: 10px;
    --r-lg: 16px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }

  /* NAV */
  .nav {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    background: rgba(252,252,250,0.9);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .nav-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
  .nav-logo img { height: 28px; width: auto; }
  .nav-links { display: flex; align-items: center; gap: 14px; }
  .nav-links a { font-size: 12px; font-weight: 600; color: var(--ink-3); transition: color .2s ease; }
  .nav-links a:hover, .nav-links a.active { color: var(--accent); }
  .lang-switch { display: flex; gap: 3px; border: 1px solid var(--line); border-radius: 100px; padding: 2px; }
  .lang-btn { border: none; background: transparent; cursor: pointer; font-size: 11px; font-weight: 700; color: var(--ink-3); padding: 4px 8px; border-radius: 100px; transition: all .2s ease; }
  .lang-btn.active { background: var(--ink); color: white; }

  /* HERO */
  .hero {
    padding: 36px 16px 20px; text-align: center;
  }
  .hero-tag {
    display: inline-block; font-size: 12px; font-weight: 700; color: var(--accent);
    background: var(--accent-light); padding: 5px 12px; border-radius: 100px; margin-bottom: 14px;
  }
  .hero h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
  .hero h1 .accent { color: var(--accent); }
  .hero p { color: var(--ink-3); font-size: 0.92rem; margin-top: 10px; }
  .hero-hint {
    margin-top: 24px; display: flex; align-items: center; justify-content: center; gap: 10px;
    color: var(--accent); font-weight: 700; font-size: 14px;
  }
  .hero-hint img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }

  /* FLOATING BOT - mobile */
  .bot-fab {
    position: fixed; bottom: 18px; right: 18px; z-index: 10000;
    width: 54px; height: 54px; border-radius: 50%; border: 3px solid white;
    background: linear-gradient(135deg, var(--accent) 0%, #FF8C42 100%);
    color: white; cursor: pointer; overflow: hidden;
    box-shadow: 0 3px 16px rgba(255,91,31,0.35);
    display: flex; align-items: center; justify-content: center;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .bot-fab:active { transform: scale(0.9); }
  .bot-fab img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .bot-fab .pulse {
    position: absolute; width: 100%; height: 100%; border-radius: 50%;
    background: var(--accent); opacity: 0;
    animation: fab-pulse 2.5s ease-out infinite;
  }
  @keyframes fab-pulse {
    0% { transform: scale(1); opacity: 0.4; }
    100% { transform: scale(1.8); opacity: 0; }
  }
  .bot-fab.open { display: none; }

  /* BOTTOM SHEET (mobile slide-up) */
  .chat-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999;
    height: 85vh;
    background: white;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 32px rgba(26,26,46,0.15);
    display: none; flex-direction: column;
    overflow: hidden;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.32,.72,0,1);
  }
  .chat-sheet.visible {
    display: flex;
    transform: translateY(0);
  }
  .chat-sheet.closing {
    transform: translateY(100%);
  }

  /* Handle bar */
  .sheet-handle {
    display: flex; justify-content: center; padding: 10px 0 4px;
  }
  .sheet-handle span {
    width: 36px; height: 4px; border-radius: 2px; background: var(--paper-3);
  }

  /* Title bar */
  .chat-titlebar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px 12px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .chat-titlebar img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
  .chat-titlebar .title-text { flex: 1; font-weight: 700; font-size: 15px; }
  .chat-titlebar button {
    background: var(--paper-2); border: none; color: var(--ink); cursor: pointer;
    width: 32px; height: 32px; border-radius: 50%; font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }

  /* Messages */
  .chat-messages {
    flex: 1; overflow-y: auto;
    padding: 14px 12px; display: flex; flex-direction: column; gap: 10px;
    background: var(--paper);
  }
  .chat-messages::-webkit-scrollbar { width: 3px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--paper-3); border-radius: 3px; }

  .msg { max-width: 90%; }
  .msg.user { align-self: flex-end; }
  .msg.bot { align-self: flex-start; }
  .msg .bubble {
    padding: 10px 13px; border-radius: 14px; font-size: 13px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--ink); color: white; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: white; color: var(--ink); border-bottom-left-radius: 4px; border: 1px solid var(--line); }
  .msg .meta { font-size: 10px; color: var(--ink-3); margin-top: 3px; }
  .msg.user .meta { text-align: right; }
  .msg .refs { font-size: 11px; color: var(--accent); margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--line); }

  .typing { display: flex; gap: 4px; padding: 10px 13px; }
  .typing span {
    width: 6px; height: 6px; background: var(--ink-3); border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  .chat-input {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 12px; border-top: 1px solid var(--line); background: white;
    flex-shrink: 0;
  }
  .chat-input textarea {
    flex: 1; resize: none; border: 1px solid var(--paper-3); border-radius: 10px;
    padding: 8px 12px; font-size: 14px; font-family: var(--font);
    line-height: 1.5; max-height: 100px; outline: none;
  }
  .chat-input textarea:focus { border-color: var(--accent); }
  .chat-input button {
    width: 38px; height: 38px; border-radius: 10px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .chat-input button:disabled { background: var(--paper-3); }

  .chat-disclaimer {
    padding: 5px 12px; font-size: 10px; color: var(--ink-3); text-align: center;
    background: var(--paper-2); border-top: 1px solid var(--line); flex-shrink: 0;
  }

  /* Overlay for closing */
  .sheet-overlay {
    position: fixed; inset: 0; z-index: 9998;
    background: rgba(0,0,0,0.3);
    display: none;
  }
  .sheet-overlay.visible { display: block; }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">
    <img src="/assets/snailai_logo.png" alt="SnailAI" />
    <span>蜗牛AI</span>
  </a>
  <div class="nav-links">
    <a href="/online-course/mobile.html" data-zh="线上课" data-en="Online">线上课</a>
    <a href="/faq/mobile.html" data-zh="FAQ" data-en="FAQ">FAQ</a>
    <a href="/ai-tutor/mobile.html" class="active" data-zh="AI 助教" data-en="AI Tutor">AI 助教</a>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="zh">中</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>
</nav>

<div class="hero">
  <div class="hero-tag" data-zh="AI 助教" data-en="AI Tutor">AI 助教</div>
  <h1 data-zh="有问题？<span class='accent'>问助教</span>" data-en="Questions? <span class='accent'>Ask the tutor</span>">有问题？<span class="accent">问助教</span></h1>
  <p data-zh="基于蜗牛AI课程知识库的AI问答助手。" data-en="AI Q&A assistant based on Snail AI course knowledge base.">基于蜗牛AI课程知识库的AI问答助手。</p>
  <div class="hero-hint" data-zh="点右下角蜗蜗头开始提问 ↓" data-en="Click the bot at bottom-right ↓">
    <img src="/assets/ai-tutor-bot.jpg" alt="" />
    <span>点右下角蜗蜗头开始提问 ↓</span>
  </div>
</div>

<!-- FLOATING BOT -->
<button class="bot-fab" id="botFab" onclick="toggleChat()">
  <span class="pulse"></span>
  <img src="/assets/ai-tutor-bot.jpg" alt="AI Tutor" />
</button>

<!-- Overlay -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeChat()"></div>

<!-- BOTTOM SHEET -->
<div class="chat-sheet" id="chatSheet">
  <div class="sheet-handle"><span></span></div>
  <div class="chat-titlebar">
    <img src="/assets/ai-tutor-bot.jpg" alt="" />
    <div class="title-text" data-zh="蜗牛AI助教" data-en="Snail AI Tutor">蜗牛AI助教</div>
    <button onclick="closeChat()" aria-label="Close">✕</button>
  </div>
  <div class="chat-messages" id="messages">
    <div class="msg bot">
      <div class="bubble" data-zh="你好！我是蜗牛AI助教，可以回答课程、学费、报名等问题。有什么想问的？" data-en="Hello! I'm the Snail AI tutor. Ask about courses, fees, enrollment, and more.">你好！我是蜗牛AI助教，可以回答课程、学费、报名等问题。有什么想问的？</div>
    </div>
  </div>
  <div class="chat-input">
    <textarea id="qInput" rows="1" placeholder="输入你的问题…" data-zh-placeholder="输入你的问题…" data-en-placeholder="Type your question…" oninput="autoGrow(this)"></textarea>
    <button id="sendBtn" onclick="sendQuestion()" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
    </button>
  </div>
  <div class="chat-disclaimer" data-zh="AI 助教仅基于蜗牛AI课程知识库回答，可能不完整。" data-en="AI Tutor answers based on course knowledge base.">AI 助教仅基于蜗牛AI课程知识库回答，可能不完整。</div>
</div>

<script>
(function() {
  var savedLang = localStorage.getItem('snailai-lang') || 'zh';
  var sheet = document.getElementById('chatSheet');
  var overlay = document.getElementById('sheetOverlay');
  var fab = document.getElementById('botFab');
  var msgArea = document.getElementById('messages');
  var qInput = document.getElementById('qInput');
  var sendBtn = document.getElementById('sendBtn');
  var sending = false;

  function setLang(lang) {
    document.querySelectorAll('[data-zh]').forEach(function(el) {
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
      var val = el.getAttribute('data-' + lang);
      if (val !== null) el.innerHTML = val;
    });
    document.querySelectorAll('[data-zh-placeholder]').forEach(function(el) {
      el.placeholder = el.getAttribute('data-' + lang + '-placeholder');
    });
    document.querySelectorAll('.lang-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    localStorage.setItem('snailai-lang', lang);
  }
  document.querySelectorAll('.lang-btn').forEach(function(b) {
    b.addEventListener('click', function() { setLang(b.dataset.lang); });
  });
  setLang(savedLang);

  window.toggleChat = function() {
    if (sheet.classList.contains('visible')) {
      closeChat();
    } else {
      openChat();
    }
  };

  function openChat() {
    sheet.classList.remove('closing');
    sheet.classList.add('visible');
    overlay.classList.add('visible');
    fab.classList.add('open');
    qInput.focus();
  }

  window.closeChat = function() {
    sheet.classList.add('closing');
    overlay.classList.remove('visible');
    fab.classList.remove('open');
    setTimeout(function() {
      sheet.classList.remove('visible', 'closing');
    }, 300);
  };

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function addMsg(role, text, refs, source) {
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    var bubble = '<div class="bubble">' + esc(text) + '</div>';
    if (refs) bubble += '<div class="refs">' + esc(refs) + '</div>';
    if (source && source !== 'facts') {
      var lang = localStorage.getItem('snailai-lang') || 'zh';
      var label = lang === 'zh' ? '来源: ' + source : 'Source: ' + source;
      bubble += '<div class="meta">' + esc(label) + '</div>';
    }
    div.innerHTML = bubble;
    msgArea.appendChild(div);
    msgArea.scrollTop = msgArea.scrollHeight;
  }

  function addTyping() {
    var div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typing-msg';
    div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    msgArea.appendChild(div);
    msgArea.scrollTop = msgArea.scrollHeight;
  }

  function removeTyping() {
    var t = document.getElementById('typing-msg');
    if (t) t.remove();
  }

  window.autoGrow = function(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  };

  window.sendQuestion = function() {
    if (sending) return;
    var q = qInput.value.trim();
    if (!q || q.length < 2) return;
    var lang = localStorage.getItem('snailai-lang') || 'zh';
    addMsg('user', q);
    qInput.value = '';
    qInput.style.height = 'auto';
    sending = true;
    sendBtn.disabled = true;
    addTyping();
    var controller = new AbortController();
    var timeout = setTimeout(function() { controller.abort(); }, 30000);

    fetch('/api/chat/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, lang: lang }),
      signal: controller.signal
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      clearTimeout(timeout);
      removeTyping();
      if (data.ok) { addMsg('bot', data.answer, data.refs || '', data.source || ''); }
      else { addMsg('bot', data.error || 'Unknown error', '', 'error'); }
    })
    .catch(function(e) {
      clearTimeout(timeout);
      removeTyping();
      var lang2 = localStorage.getItem('snailai-lang') || 'zh';
      addMsg('bot', lang2 === 'zh' ? '网络错误或超时，请稍后再试。' : 'Network error. Please try again.', '', 'error');
    })
    .finally(function() {
      sending = false;
      sendBtn.disabled = false;
    });
  };

  qInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
  });

  // Auto-open on first visit
  var autoOpened = sessionStorage.getItem('snailai-chat-auto');
  if (!autoOpened) {
    setTimeout(function() { openChat(); sessionStorage.setItem('snailai-chat-auto', '1'); }, 600);
  }
})();
</script>

</body>
</html>
