<!DOCTYPE html>
<html lang="zh-CN" data-title-zh="蜗牛AI · AI 助教" data-title-en="SnailAI · AI Tutor">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>蜗牛AI · AI 助教</title>
<meta name="description" content="蜗牛AI助教 — 基于课程知识库的AI问答助手，随时为学员解答疑问。" />
<style>
  :root {
    --ink: #1A1A2E;
    --ink-2: #2A2A40;
    --ink-3: #6A6A85;
    --paper: #FCFCFA;
    --paper-2: #F5F4EE;
    --paper-3: #E8E7E0;
    --accent: #FF5B1F;
    --accent-2: #E84A0F;
    --accent-light: rgba(255,91,31,0.08);
    --accent-warm: #FFF5EE;
    --green: #10b981;
    --line: rgba(26,26,46,0.08);
    --shadow-sm: 0 1px 3px rgba(26,26,46,0.04), 0 2px 8px rgba(26,26,46,0.04);
    --shadow-md: 0 4px 16px rgba(26,26,46,0.08);
    --r-md: 10px;
    --r-lg: 16px;
    --maxw: 820px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }

  /* ===== NAV ===== */
  .nav {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px;
    background: rgba(252,252,250,0.85);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; }
  .nav-logo img { height: 34px; width: auto; }
  .nav-links { display: flex; align-items: center; gap: 22px; }
  .nav-links a { font-size: 14px; font-weight: 600; color: var(--ink-3); transition: color .2s ease; }
  .nav-links a:hover, .nav-links a.active { color: var(--accent); }
  .lang-switch { display: flex; gap: 4px; border: 1px solid var(--line); border-radius: 100px; padding: 3px; }
  .lang-btn { border: none; background: transparent; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--ink-3); padding: 5px 10px; border-radius: 100px; transition: all .2s ease; }
  .lang-btn.active { background: var(--ink); color: white; }

  /* ===== HERO ===== */
  .hero {
    max-width: var(--maxw); margin: 0 auto; padding: 56px 24px 32px; text-align: center;
  }
  .hero-tag {
    display: inline-block; font-size: 13px; font-weight: 700; color: var(--accent);
    background: var(--accent-light); padding: 6px 14px; border-radius: 100px; margin-bottom: 20px;
  }
  .hero h1 {
    font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15;
  }
  .hero h1 .accent { color: var(--accent); }
  .hero p {
    max-width: 560px; margin: 16px auto 0; color: var(--ink-3); font-size: 1.02rem;
  }

  /* ===== CHAT CONTAINER ===== */
  .chat-wrap {
    max-width: 720px; margin: 0 auto; padding: 0 24px 100px;
  }
  .chat-box {
    background: white; border: 1px solid var(--line); border-radius: var(--r-lg);
    box-shadow: var(--shadow-md); overflow: hidden;
  }

  /* Messages area */
  .chat-messages {
    min-height: 320px; max-height: 520px; overflow-y: auto;
    padding: 24px 22px; display: flex; flex-direction: column; gap: 16px;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--paper-3); border-radius: 4px; }

  .msg { max-width: 85%; }
  .msg.user { align-self: flex-end; }
  .msg.bot { align-self: flex-start; }

  .msg .bubble {
    padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--ink); color: white; border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: var(--paper-2); color: var(--ink); border-bottom-left-radius: 4px;
  }
  .msg .meta {
    font-size: 11px; color: var(--ink-3); margin-top: 4px;
  }
  .msg.user .meta { text-align: right; }
  .msg .refs {
    font-size: 12px; color: var(--accent); margin-top: 6px; padding-top: 6px;
    border-top: 1px solid var(--line);
  }

  /* Typing indicator */
  .typing { display: flex; gap: 4px; padding: 12px 16px; }
  .typing span {
    width: 7px; height: 7px; background: var(--ink-3); border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* Input area */
  .chat-input {
    display: flex; align-items: flex-end; gap: 10px;
    padding: 14px 18px; border-top: 1px solid var(--line); background: var(--paper);
  }
  .chat-input textarea {
    flex: 1; resize: none; border: 1px solid var(--paper-3); border-radius: 12px;
    padding: 10px 14px; font-size: 14px; font-family: var(--font);
    line-height: 1.5; max-height: 120px; outline: none;
    transition: border-color .2s;
  }
  .chat-input textarea:focus { border-color: var(--accent); }
  .chat-input button {
    width: 42px; height: 42px; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, transform .1s;
  }
  .chat-input button:hover { background: var(--accent-2); }
  .chat-input button:active { transform: scale(0.95); }
  .chat-input button:disabled { background: var(--paper-3); cursor: not-allowed; }

  /* Disclaimer */
  .disclaimer {
    text-align: center; font-size: 11px; color: var(--ink-3); padding: 10px 24px 0;
  }

  /* Error / status */
  .chat-error {
    padding: 12px 16px; background: #FEF2F2; color: #991B1B;
    border-radius: 8px; font-size: 13px; margin: 8px 0;
  }
  .chat-status {
    padding: 8px 16px; background: var(--accent-warm); color: var(--accent);
    border-radius: 8px; font-size: 13px; text-align: center;
  }

  /* ===== FLOATING BOT (right-bottom) ===== */
  .bot-fab {
    position: fixed; bottom: 28px; right: 28px; z-index: 999;
    width: 64px; height: 64px; border-radius: 50%; border: 3px solid white;
    background: linear-gradient(135deg, var(--accent) 0%, #FF8C42 100%);
    color: white; cursor: pointer; overflow: hidden;
    box-shadow: 0 4px 20px rgba(255,91,31,0.35);
    display: flex; align-items: center; justify-content: center;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s;
  }
  .bot-fab:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(255,91,31,0.45); }
  .bot-fab img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
  }
  .bot-fab .pulse {
    position: absolute; width: 100%; height: 100%; border-radius: 50%;
    background: var(--accent); opacity: 0;
    animation: fab-pulse 2.5s ease-out infinite;
  }
  @keyframes fab-pulse {
    0% { transform: scale(1); opacity: 0.4; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 640px) {
    .hero h1 { font-size: 1.6rem; }
    .chat-wrap { padding: 0 12px 80px; }
    .chat-messages { min-height: 260px; padding: 16px 14px; }
    .msg .bubble { font-size: 13px; padding: 10px 13px; }
    .bot-fab { bottom: 20px; right: 20px; width: 52px; height: 52px; }
    .bot-fab svg { width: 26px; height: 26px; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <a href="/" class="nav-logo">
    <img src="/assets/snailai_logo_v2.png" alt="SnailAI" />
    <span>蜗牛AI</span>
  </a>
  <div class="nav-links">
    <a href="/online-course/" data-zh="线上课" data-en="Online">线上课</a>
    <a href="/offline-course/" data-zh="线下课" data-en="Offline">线下课</a>
    <a href="/faq/" data-zh="FAQ" data-en="FAQ">FAQ</a>
    <a href="/ai-tutor/" class="active" data-zh="AI 助教" data-en="AI Tutor">AI 助教</a>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="zh">中文</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-tag" data-zh="AI 助教" data-en="AI Tutor">AI 助教</div>
  <h1 data-zh="有问题？<span class='accent'>问助教</span>" data-en="Questions? <span class='accent'>Ask the tutor</span>">有问题？<span class="accent">问助教</span></h1>
  <p data-zh="基于蜗牛AI课程知识库的AI问答助手，随时为你解答课程、学费、报名等问题。" data-en="AI Q&A assistant based on Snail AI course knowledge base. Ask about courses, fees, enrollment, and more.">基于蜗牛AI课程知识库的AI问答助手，随时为你解答课程、学费、报名等问题。</p>
</div>

<!-- CHAT -->
<div class="chat-wrap">
  <div class="chat-box">
    <div class="chat-messages" id="messages">
      <!-- Welcome message -->
      <div class="msg bot">
        <div class="bubble" data-zh="你好！我是蜗牛AI助教，可以回答课程、学费、报名、登录等问题。有什么想问的？" data-en="Hello! I'm the Snail AI tutor. I can answer questions about courses, fees, enrollment, and login. What would you like to know?">你好！我是蜗牛AI助教，可以回答课程、学费、报名、登录等问题。有什么想问的？</div>
      </div>
    </div>
    <div class="chat-input">
      <textarea id="qInput" rows="1" placeholder="输入你的问题…" data-zh-placeholder="输入你的问题…" data-en-placeholder="Type your question…" oninput="autoGrow(this)"></textarea>
      <button id="sendBtn" onclick="sendQuestion()" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
      </button>
    </div>
  </div>
  <div class="disclaimer" data-zh="AI 助教仅基于蜗牛AI课程知识库回答，可能不完整，请以官方信息为准。" data-en="AI Tutor answers are based on Snail AI course knowledge base and may not be complete. Please verify with official sources.">AI 助教仅基于蜗牛AI课程知识库回答，可能不完整，请以官方信息为准。</div>
</div>

<!-- FLOATING BOT BUTTON -->
<button class="bot-fab" onclick="window.scrollTo({top:0,behavior:'smooth'});document.getElementById('qInput').focus();">
  <span class="pulse"></span>
  <img src="/assets/ai-tutor-bot.jpg" alt="AI Tutor" />
</button>

<script>
(function() {
  const savedLang = localStorage.getItem('snailai-lang') || 'zh';
  const msgArea = document.getElementById('messages');
  const qInput = document.getElementById('qInput');
  const sendBtn = document.getElementById('sendBtn');
  let sending = false;

  function setLang(lang) {
    document.querySelectorAll('[data-zh]').forEach(function(el) {
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
      var val = el.getAttribute('data-' + lang);
      if (val !== null) el.innerHTML = val;
    });
    document.querySelectorAll('[data-zh-placeholder]').forEach(function(el) {
      el.placeholder = el.getAttribute('data-' + lang + '-placeholder');
    });
    document.querySelectorAll('.lang-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    localStorage.setItem('snailai-lang', lang);
  }

  document.querySelectorAll('.lang-btn').forEach(function(b) {
    b.addEventListener('click', function() { setLang(b.dataset.lang); });
  });
  setLang(savedLang);

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function addMsg(role, text, refs, source) {
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    var bubble = '<div class="bubble">' + esc(text) + '</div>';
    if (refs) {
      bubble += '<div class="refs">' + esc(refs) + '</div>';
    }
    if (source && source !== 'facts') {
      var lang = localStorage.getItem('snailai-lang') || 'zh';
      var label = lang === 'zh' ? '来源: ' + source : 'Source: ' + source;
      bubble += '<div class="meta">' + esc(label) + '</div>';
    }
    div.innerHTML = bubble;
    msgArea.appendChild(div);
    msgArea.scrollTop = msgArea.scrollHeight;
  }

  function addTyping() {
    var div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typing-msg';
    div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    msgArea.appendChild(div);
    msgArea.scrollTop = msgArea.scrollHeight;
  }

  function removeTyping() {
    var t = document.getElementById('typing-msg');
    if (t) t.remove();
  }

  window.autoGrow = function(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  };

  window.sendQuestion = function() {
    if (sending) return;
    var q = qInput.value.trim();
    if (!q || q.length < 2) return;

    var lang = localStorage.getItem('snailai-lang') || 'zh';
    addMsg('user', q);
    qInput.value = '';
    qInput.style.height = 'auto';
    sending = true;
    sendBtn.disabled = true;

    addTyping();

    var controller = new AbortController();
    var timeout = setTimeout(function() { controller.abort(); }, 30000);

    fetch('/api/chat/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, lang: lang }),
      signal: controller.signal
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      clearTimeout(timeout);
      removeTyping();
      if (data.ok) {
        addMsg('bot', data.answer, data.refs || '', data.source || '');
      } else {
        addMsg('bot', data.error || 'Unknown error', '', 'error');
      }
    })
    .catch(function(e) {
      clearTimeout(timeout);
      removeTyping();
      var lang2 = localStorage.getItem('snailai-lang') || 'zh';
      var errMsg = lang2 === 'zh'
        ? '网络错误或超时，请稍后再试。'
        : 'Network error or timeout. Please try again later.';
      addMsg('bot', errMsg, '', 'error');
    })
    .finally(function() {
      sending = false;
      sendBtn.disabled = false;
    });
  };

  qInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  });
})();
</script>

</body>
</html>
