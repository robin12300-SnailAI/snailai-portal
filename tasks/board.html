<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目看板 — SnailAI.AI</title>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<style>
:root{--coral:#FF5B1F;--gold:#D4A547;--ink:#1A1A2E;--coral-light:#FFF5EE;--gold-bg:#FDF6E3;--success:#22C55E;--bg:#0f0f1a;--card:#1a1a2e;--card2:#222240;--border:1px solid #2a2a4a;--radius:10px;--text:#e0e0e0;--text2:#8888aa;--danger:#EF4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
/* Header */
.header{background:var(--card);border-bottom:var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.header .logo{font-size:18px;font-weight:800;color:#fff}
.header .logo .ai{color:var(--coral)}
.header .ver{font-size:9px;background:var(--coral);color:#fff;border-radius:8px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.header-right{display:flex;align-items:center;gap:14px}
.header .user-name{font-size:13px;color:var(--text2)}
.btn{padding:8px 16px;border:none;border-radius:var(--radius);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s}
.btn-coral{background:var(--coral);color:#fff}
.btn-coral:hover{filter:brightness(1.1)}
.btn-outline{background:transparent;border:1px solid #444;color:var(--text)}
.btn-outline:hover{border-color:var(--coral);color:var(--coral)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-green{background:var(--success);color:#fff}
.btn-gold{background:var(--gold);color:#fff}
/* Countdown */
.countdown-bar{background:linear-gradient(135deg,#1a1a2e 0%,#222240 100%);padding:28px 24px;text-align:center;border-bottom:var(--border)}
.countdown-bar .event-name{font-size:22px;font-weight:800;color:#fff;margin-bottom:4px}
.countdown-bar .event-name .ai{color:var(--coral)}
.countdown-bar .event-sub{font-size:13px;color:var(--text2);margin-bottom:14px}
.countdown-bar .days{display:inline-flex;align-items:baseline;gap:4px;background:var(--coral);padding:8px 24px;border-radius:50px}
.countdown-bar .days .num{font-size:42px;font-weight:900;color:#fff}
.countdown-bar .days .unit{font-size:14px;color:rgba(255,255,255,.8)}
.countdown-bar .event-meta{margin-top:12px;font-size:13px;color:var(--text2)}
.countdown-bar .event-meta span{margin:0 12px}
.countdown-bar .progress-wrap{max-width:500px;margin:16px auto 0}
.countdown-bar .progress-outer{height:8px;background:#2a2a4a;border-radius:4px;overflow:hidden}
.countdown-bar .progress-inner{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--coral),var(--gold));transition:width .5s}
.countdown-bar .progress-label{font-size:11px;color:var(--text2);margin-top:4px;text-align:right}
/* Workstream cards */
.board{max-width:1200px;margin:0 auto;padding:20px 16px}
.ws-card{background:var(--card);border:var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.ws-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;user-select:none;border-bottom:var(--border)}
.ws-header:hover{background:var(--card2)}
.ws-header .ws-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.ws-header .ws-icon{font-size:18px}
.ws-header .ws-stats{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text2)}
.ws-header .ws-progress{width:120px;height:6px;background:#2a2a4a;border-radius:3px;overflow:hidden}
.ws-header .ws-progress .fill{height:100%;border-radius:3px;transition:width .3s}
.ws-tasks{padding:4px 0}
.task-row{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid #1e1e38;font-size:13px;transition:background .15s}
.task-row:hover{background:var(--card2)}
.task-row:last-child{border-bottom:none}
.task-row .task-check{width:20px;height:20px;border-radius:50%;border:2px solid #444;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all .15s}
.task-row .task-check.done{background:var(--success);border-color:var(--success);color:#fff}
.task-row .task-check.in_progress{border-color:var(--gold);background:rgba(212,165,71,.15)}
.task-row .task-info{flex:1;min-width:0}
.task-row .task-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-row .task-title.is-done{text-decoration:line-through;opacity:.6}
.task-row .task-meta{font-size:11px;color:var(--text2);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.task-row .task-assignee{font-size:11px;background:#2a2a4a;padding:2px 8px;border-radius:10px;color:var(--text2);white-space:nowrap}
.task-row .task-actions{display:flex;gap:4px;flex-shrink:0}
/* Status badge */
.status-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;display:inline-block;text-transform:uppercase;letter-spacing:.3px}
.status-badge.todo{background:#2a2a4a;color:#6B7280}
.status-badge.in_progress{background:rgba(212,165,71,.15);color:var(--gold)}
.status-badge.in_review{background:rgba(255,91,31,.15);color:var(--coral)}
.status-badge.done{background:rgba(34,197,94,.15);color:var(--success)}
.status-badge.closed{background:#2a2a4a;color:#555}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:24px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:var(--border);border-radius:14px;padding:28px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto}
.modal h3{font-size:17px;font-weight:700;margin-bottom:18px;color:#fff}
.modal .field{margin-bottom:14px}
.modal .field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--text2)}
.modal .field input,.modal .field textarea,.modal .field select{width:100%;padding:8px 12px;background:var(--card2);border:1px solid #3a3a5a;border-radius:8px;font-size:14px;font-family:inherit;color:#fff}
.modal .field input:focus,.modal .field textarea:focus,.modal .field select:focus{outline:none;border-color:var(--coral)}
.modal .field select option{background:var(--card);color:#fff}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
/* Risk card */
.risk-card{background:var(--card);border:1px solid #3a2020;border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.risk-card h4{color:var(--danger);font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.risk-card ul{list-style:none;padding:0}
.risk-card li{font-size:12px;color:var(--text2);padding:4px 0;display:flex;align-items:center;gap:6px}
.risk-card li::before{content:"⚠️";font-size:10px}
/* Links card */
.links-card{background:var(--card);border:var(--border);border-radius:var(--radius);padding:16px 18px}
.links-card h4{font-size:14px;margin-bottom:8px;color:#fff}
.links-card a{color:var(--coral);font-size:13px;text-decoration:none;display:block;padding:3px 0}
.links-card a:hover{text-decoration:underline}
/* Empty */
.empty{text-align:center;padding:40px;color:var(--text2)}
/* Loading */
.loading{text-align:center;padding:40px;color:var(--text2)}
/* Project selector */
.project-selector{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap}
.project-tab{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;background:var(--card);border:1px solid #2a2a4a;color:var(--text2);transition:all .15s}
.project-tab:hover{border-color:var(--coral);color:var(--coral)}
.project-tab.active{background:var(--coral);color:#fff;border-color:var(--coral)}
</style>
<link rel="stylesheet" href="../assets/site.css?v=465">
  <script src="../assets/site.js?v=465"></script>
</head>
<body>

<div class="header">
  <div class="logo">Snail<span class="ai">AI</span>.AI <span class="ver">V1.3.0</span> <span style="font-size:12px;color:var(--text2);font-weight:400;margin-left:8px">项目看板</span></div>
  <div class="header-right">
    <span class="user-name" id="userName"></span>
    <button class="btn btn-outline btn-sm" onclick="location.href='index.html'">← 任务列表</button>
  </div>
</div>

<div id="projectSelector" class="project-selector"></div>
<div id="boardContent"><div class="loading">加载中...</div></div>

<!-- Update Status Modal -->
<div class="modal-overlay" id="statusModal">
  <div class="modal">
    <h3>更新任务状态</h3>
    <input type="hidden" id="umTaskId">
    <input type="hidden" id="umProjectId">
    <div class="field"><label>任务</label><input id="umTaskTitle" readonly style="opacity:.6"></div>
    <div class="field"><label>状态</label>
      <select id="umStatus">
        <option value="todo">待开始 (To Do)</option>
        <option value="in_progress">进行中 (In Progress)</option>
        <option value="in_review">待审批 (In Review)</option>
        <option value="done">已完成 (Done)</option>
      </select>
    </div>
    <div class="field"><label>进度 (%)</label><input type="number" id="umProgress" min="0" max="100" value="0"></div>
    <div class="actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-coral" onclick="submitStatus()">确认</button>
    </div>
  </div>
</div>

<script>
const API='/api/internal-tasks';
let TOKEN=localStorage.getItem('itask_token');
let USER=JSON.parse(localStorage.getItem('itask_user')||'{}');
if(!TOKEN)location.href='login.html';

document.getElementById('userName').textContent=USER.name||USER.username||'';

async function api(path,opts={}){
  const r=await fetch(API+path,{...opts,headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json',...opts.headers}});
  if(r.status===401){localStorage.removeItem('itask_token');location.href='login.html';return null;}
  return r.json();
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

const STATUS_ZH={todo:'待开始',in_progress:'进行中',in_review:'待审批',done:'已完成',closed:'已关闭'};
const WS_ICONS={'线0 策划场地':'🏟️','线1 宣传物料':'🎨','线2 学员动员登记':'📣','线3 内部协同':'🏢','线4 项目落地':'🎯','线5 活动执行':'🎪','线6 招生转化':'💰','线7 风险保障':'🛡️'};

let projects=[];
let currentProjectId=null;

async function loadProjects(){
  const d=await api('/projects');
  if(!d||!d.ok)return;
  projects=d.projects||[];
  const sel=document.getElementById('projectSelector');
  if(!projects.length){
    sel.innerHTML='<span style="color:var(--text2);font-size:13px;padding:8px">暂无项目</span>';
    document.getElementById('boardContent').innerHTML='<div class="empty">还没有创建任何项目</div>';
    return;
  }
  sel.innerHTML=projects.map(p=>`<div class="project-tab${p.id===currentProjectId?' active':''}" onclick="selectProject(${p.id})">${esc(p.name)}${p.target_date?` <span style="font-size:10px;opacity:.6">${p.target_date}</span>`:''}</div>`).join('');
  if(!currentProjectId)currentProjectId=projects[0].id;
  loadBoard(currentProjectId);
}

function selectProject(id){
  currentProjectId=id;
  document.querySelectorAll('.project-tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  loadBoard(id);
}

async function loadBoard(projectId){
  const d=await api('/projects/'+projectId);
  if(!d||!d.ok){document.getElementById('boardContent').innerHTML='<div class="empty">加载失败</div>';return;}
  const proj=d.project;
  const workstreams=d.workstreams||{};
  const tasks=d.tasks||[];

  // Countdown
  const target=proj.target_date?new Date(proj.target_date+'T00:00:00+10:00'):null;
  const now=new Date();
  let daysLeft='-';
  if(target){
    const diff=Math.ceil((target-now)/(1000*60*60*24));
    daysLeft=diff>0?diff:0;
  }

  // Overall progress
  const doneCount=proj.done_tasks||0;
  const totalCount=proj.total_tasks||1;
  const overallProgress=proj.progress||0;

  // Workstream order & details
  const wsOrder=['线0 策划场地','线1 宣传物料','线2 学员动员登记','线3 内部协同','线4 项目落地','线5 活动执行','线6 招生转化','线7 风险保障'];
  const orderedWs=[...wsOrder.filter(w=>workstreams[w]),...Object.keys(workstreams).filter(w=>!wsOrder.includes(w))];

  let html=`
  <div class="countdown-bar">
    <div class="event-name">${esc(proj.name)}</div>
    ${proj.name_en?`<div class="event-sub">${esc(proj.name_en)}</div>`:''}
    <div class="days"><span class="num">${daysLeft}</span><span class="unit">天</span></div>
    <div class="event-meta">
      ${target?`<span>🎯 目标日期: ${proj.target_date}</span>`:''}
      <span>📋 任务: ${doneCount}/${totalCount} 完成</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-outer"><div class="progress-inner" style="width:${overallProgress}%"></div></div>
      <div class="progress-label">${overallProgress}% 总进度</div>
    </div>
  </div>
  <div class="board">`;

  // Workstream cards
  for(const wsName of orderedWs){
    const wsTasks=workstreams[wsName];
    const wsDone=wsTasks.filter(t=>t.status==='done'||t.status==='closed').length;
    const wsTotal=wsTasks.length;
    const wsProgress=wsTotal?Math.round(wsDone/wsTotal*100):0;
    const wsColor=wsProgress>=100?'var(--success)':wsProgress>0?'var(--gold)':'#444';

    html+=`
    <div class="ws-card">
      <div class="ws-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
        <div class="ws-title"><span class="ws-icon">${WS_ICONS[wsName]||'📌'}</span>${esc(wsName)}</div>
        <div class="ws-stats">
          <span>${wsDone}/${wsTotal}</span>
          <div class="ws-progress"><div class="fill" style="width:${wsProgress}%;background:${wsColor}"></div></div>
        </div>
      </div>
      <div class="ws-tasks">
        ${wsTasks.map(t=>`
        <div class="task-row">
          <div class="task-check ${t.status==='done'||t.status==='closed'?'done':t.status==='in_progress'?'in_progress':''}" onclick="openStatusModal(${proj.id},${t.id},'${esc(t.title_zh||t.title)}','${t.status}',${t.progress_percent||0})">
            ${t.status==='done'||t.status==='closed'?'✓':t.status==='in_progress'?'◐':''}
          </div>
          <div class="task-info">
            <div class="task-title ${t.status==='done'||t.status==='closed'?'is-done':''}">${esc(t.title_zh||t.title)}</div>
            <div class="task-meta">
              <span class="status-badge ${t.status}">${STATUS_ZH[t.status]||t.status}</span>
              ${t.deadline?`<span>📅 ${t.deadline}</span>`:''}
              <span>📊 ${t.progress_percent||0}%</span>
            </div>
          </div>
          <span class="task-assignee">${esc(t.assigned_to_name||t.assigned_to)}</span>
          <div class="task-actions">
            <button class="btn btn-sm btn-outline" onclick="openStatusModal(${proj.id},${t.id},'${esc(t.title_zh||t.title)}','${t.status}',${t.progress_percent||0})">更新</button>
          </div>
        </div>`).join('')}
      </div>
    </div>`;
  }

  // Risk card
  const blocked=tasks.filter(t=>t.status==='in_progress'&&(!t.progress_percent||t.progress_percent<20));
  if(blocked.length){
    html+=`
    <div class="risk-card">
      <h4>⚠️ 需关注</h4>
      <ul>
        ${blocked.map(t=>`<li>${esc(t.title_zh||t.title)} — ${esc(t.assigned_to_name||t.assigned_to)} (${t.progress_percent||0}%)</li>`).join('')}
      </ul>
    </div>`;
  }

  // Links card
  html+=`
    <div class="links-card">
      <h4>📎 快捷入口</h4>
      <a href="index.html">📋 我的任务列表</a>
      ${USER.role==='admin'?'<a href="admin/index.html">⚙️ 管理后台</a>':''}
    </div>
  </div>`;

  document.getElementById('boardContent').innerHTML=html;
}

function openStatusModal(projectId,taskId,title,status,progress){
  document.getElementById('umTaskId').value=taskId;
  document.getElementById('umProjectId').value=projectId;
  document.getElementById('umTaskTitle').value=title;
  document.getElementById('umStatus').value=status==='closed'?'done':status;
  document.getElementById('umProgress').value=progress||0;
  document.getElementById('statusModal').classList.add('show');
}

function closeModal(){
  document.getElementById('statusModal').classList.remove('show');
}

async function submitStatus(){
  const taskId=document.getElementById('umTaskId').value;
  const projectId=document.getElementById('umProjectId').value;
  const status=document.getElementById('umStatus').value;
  const progress=parseInt(document.getElementById('umProgress').value)||0;
  const d=await api('/projects/'+projectId+'/tasks/'+taskId+'/status',{method:'POST',body:JSON.stringify({status,progress_percent:progress})});
  if(d&&d.ok){closeModal();loadBoard(parseInt(projectId));}
  else alert('更新失败: '+(d&&d.error));
}

// Initial load
loadProjects();
</script>
</body>
</html>
