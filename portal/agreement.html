<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agreement — SnailAI Client Portal</title>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<style>
:root{--coral:#FF5B1F;--gold:#D4A547;--ink:#1A1A2E;--coral-light:#FFF5EE;--success:#22C55E;--amber:#F59E0B;--bg:#faf9f6;--border:0.5px solid #e0ddd6;--radius:8px;--grey:#9CA3AF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.top-bar{background:var(--ink);color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.top-bar .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.top-bar .brand .ai{color:var(--coral)}
.top-bar .ver{font-size:10px;background:var(--coral);border-radius:8px;padding:1px 7px;margin-left:4px}
.top-bar .portal-label{font-size:11px;color:#aaa;font-weight:500;border-left:1px solid #444;padding-left:8px;margin-left:2px}
.top-bar .user-area{display:flex;align-items:center;gap:12px;font-size:13px}
.top-bar .user-area a{color:var(--coral);cursor:pointer;font-weight:600;text-decoration:none}
.top-bar .user-area a:hover{text-decoration:underline}
.lang-btn{font-size:11px;color:#aaa;cursor:pointer;border:1px solid #555;border-radius:4px;padding:2px 8px;background:none}
.lang-btn:hover{color:var(--coral);border-color:var(--coral)}
.project-switcher{background:var(--coral-light);border-bottom:1px solid #fdd;padding:10px 20px;display:none;align-items:center;gap:10px;font-size:13px}
.project-switcher.show{display:flex}
.project-switcher label{font-weight:700;color:var(--coral)}
.project-switcher select{padding:6px 10px;border-radius:var(--radius);border:var(--border);font-size:13px;font-family:inherit;background:#fff}
.nav-bar{background:#fff;border-bottom:var(--border);padding:0 20px;display:flex;gap:4px;overflow-x:auto}
.nav-bar a{padding:12px 16px;font-size:14px;font-weight:600;color:#888;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s}
.nav-bar a:hover{color:var(--ink)}
.nav-bar a.active{color:var(--coral);border-bottom-color:var(--coral)}
.content{max-width:960px;margin:0 auto;padding:28px 20px 60px}
/* Agreement card */
.agr-card{background:#fff;border:var(--border);border-radius:10px;padding:28px;text-align:center;margin-bottom:20px}
.agr-icon{font-size:48px;margin-bottom:16px}
.agr-title{font-size:20px;font-weight:800;margin-bottom:8px}
.agr-status{font-size:14px;color:#888;margin-bottom:16px;line-height:1.6}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px;display:inline-block}
.badge-preparing{background:#fef3c7;color:#92400e}
.badge-ready{background:#dbeafe;color:#1e40af}
.badge-signed{background:#dcfce7;color:#166534}
.badge-none{background:#f3f4f6;color:#666}
/* State machine */
.state-machine{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:20px 0}
.state-step{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;background:#f3f4f6;color:#888}
.state-step.active{background:var(--coral);color:#fff}
.state-step.done{background:var(--success);color:#fff}
.state-arrow{display:flex;align-items:center;color:#ccc;font-size:14px}
/* Bilingual note */
.bilingual-note{font-size:12px;color:#aaa;margin-top:16px;line-height:1.5;font-style:italic}
/* Button */
.btn{display:inline-block;padding:12px 28px;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;text-align:center;transition:all .15s;margin-top:12px}
.btn-coral{background:var(--coral);color:#fff}
.btn-coral:hover{filter:brightness(0.93)}
.btn-coral:disabled{opacity:.5;cursor:not-allowed}
.btn-preview{background:#f3f4f6;color:#888;cursor:not-allowed}
.empty-state{text-align:center;padding:40px 20px;color:#aaa;font-size:14px}
@media(max-width:640px){
  .top-bar{padding:8px 12px}
  .content{padding:20px 14px 40px}
  .state-machine{flex-direction:column;align-items:center}
  .state-arrow{transform:rotate(90deg)}
}
[data-zh]{display:none}
[data-en]{display:inline}
.lang-zh [data-en]{display:none}
.lang-zh [data-zh]{display:inline}
.lang-en [data-zh]{display:none}
.lang-en [data-en]{display:inline}
</style>
</head>
<body>

<div class="top-bar">
  <div class="brand">
    <span>Snail<span class="ai">AI</span>.AI</span>
    <span class="ver">V1.0.0</span>
    <span class="portal-label"><span data-en="Client Portal" data-zh="客户门户">Client Portal</span></span>
  </div>
  <div class="user-area">
    <span id="userName"></span>
    <span class="lang-btn" onclick="toggleLang()" id="langBtn">中文</span>
    <a onclick="doLogout()" data-en="Sign Out" data-zh="退出">Sign Out</a>
  </div>
</div>

<div class="project-switcher" id="projectSwitcher">
  <label data-en="Viewing project:" data-zh="查看项目：">Viewing project:</label>
  <select id="projectSelect" onchange="switchProject()"></select>
</div>

<div class="nav-bar">
  <a href="index.html" data-en="Dashboard" data-zh="总览">Dashboard</a>
  <a href="quotation.html" data-en="Quotation" data-zh="报价">Quotation</a>
  <a href="agreement.html" class="active" data-en="Agreement" data-zh="合同">Agreement</a>
  <a href="tasks.html" data-en="My Tasks" data-zh="我的任务">My Tasks</a>
  <a href="progress.html" data-en="Progress" data-zh="项目进度">Progress</a>
  <a href="account.html" data-en="Account" data-zh="账号">Account</a>
</div>

<div class="content" id="mainContent">
  <div class="empty-state">Loading...</div>
</div>

<script>
const API = '/api/portal';
let token = localStorage.getItem('portal_token');
let currentUser = null;
let currentProjectId = null;

async function checkAuth() {
  if (!token) { window.location.href = 'login.html'; return; }
  try {
    const r = await fetch(API + '/me', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) { localStorage.removeItem('portal_token'); window.location.href = 'login.html'; return; }
    const d = await r.json();
    currentUser = d.user;
    document.getElementById('userName').textContent = currentUser.name;
    if (currentUser.is_demo) {
      const sw = document.getElementById('projectSwitcher');
      sw.classList.add('show');
      const sel = document.getElementById('projectSelect');
      sel.innerHTML = currentUser.projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      currentProjectId = parseInt(sel.value);
    } else {
      currentProjectId = currentUser.projects.length ? currentUser.projects[0].id : null;
    }
    loadAgreement();
  } catch(e) { window.location.href = 'login.html'; }
}

async function loadAgreement() {
  if (!currentProjectId) { document.getElementById('mainContent').innerHTML = '<div class="empty-state">No project found.</div>'; return; }
  try {
    const r = await fetch(API + '/overview?project_id=' + currentProjectId, { headers: { 'Authorization': 'Bearer ' + token } });
    const d = await r.json();
    renderAgreement(d.overview);
  } catch(e) {
    document.getElementById('mainContent').innerHTML = '<div class="empty-state">Failed to load agreement.</div>';
  }
}

function renderAgreement(overview) {
  const status = overview.agreement_status || 'none';
  const isDemo = currentUser.is_demo;
  const states = ['preparing', 'ready_to_sign', 'signed_by_client', 'countersigned', 'fully_executed'];
  const stateLabels = {
    preparing: 'Preparing',
    ready_to_sign: 'Ready to Sign',
    signed_by_client: 'Signed by You',
    countersigned: 'Countersigned',
    fully_executed: 'Fully Executed'
  };
  const currentIdx = states.indexOf(status);

  let html = `<div class="agr-card">`;

  // Icon
  if (status === 'fully_executed') html += `<div class="agr-icon">✅</div>`;
  else if (status === 'preparing' || status === 'none') html += `<div class="agr-icon">📄</div>`;
  else html += `<div class="agr-icon">📝</div>`;

  // Title
  html += `<div class="agr-title" data-en="Digital Services Agreement" data-zh="数字服务协议">Digital Services Agreement</div>`;

  // Status badge
  const badgeClass = status === 'fully_executed' ? 'badge-signed' :
                     status === 'ready_to_sign' ? 'badge-ready' :
                     status === 'preparing' ? 'badge-preparing' : 'badge-none';
  const badgeLabel = stateLabels[status] || 'Not Available';
  html += `<span class="badge ${badgeClass}">${badgeLabel}</span>`;

  // Description
  if (status === 'preparing' || status === 'none') {
    html += `<div class="agr-status" style="margin-top:16px">
      <span data-en="The final agreement document is being prepared. You will be notified once it is ready for your review and signature." data-zh="最终合同文件正在准备中。一旦准备好供您审阅和签署，我们会通知您。">The final agreement document is being prepared. You will be notified once it is ready for your review and signature.</span>
    </div>`;
  } else if (status === 'ready_to_sign') {
    if (isDemo) {
      html += `<div class="agr-status" style="margin-top:16px;color:var(--amber)">
        <span data-en="Preview Only — This is a demo account. Real signing is disabled." data-zh="仅预览 — 这是测试账户，真实签署已禁用。">Preview Only — This is a demo account. Real signing is disabled.</span>
      </div>
      <button class="btn btn-preview" disabled data-en="Preview Only" data-zh="仅预览">Preview Only</button>`;
    } else {
      html += `<div class="agr-status" style="margin-top:16px">
        <span data-en="The agreement is ready for your review and signature. Click below to review and sign." data-zh="合同已准备好供您审阅和签署。点击下方按钮查看并签署。">The agreement is ready for your review and signature. Click below to review and sign.</span>
      </div>
      <button class="btn btn-coral" onclick="goSign()" data-en="Review &amp; Sign" data-zh="查看并签署">Review & Sign</button>`;
    }
  } else if (status === 'signed_by_client') {
    html += `<div class="agr-status" style="margin-top:16px">
      <span data-en="You have signed the agreement. Waiting for SnailAI to countersign." data-zh="您已签署合同，等待蜗牛 AI 会签。">You have signed the agreement. Waiting for SnailAI to countersign.</span>
    </div>`;
  } else if (status === 'countersigned') {
    html += `<div class="agr-status" style="margin-top:16px">
      <span data-en="SnailAI has countersigned. The agreement will be fully executed shortly." data-zh="蜗牛 AI 已会签。合同即将完全生效。">SnailAI has countersigned. The agreement will be fully executed shortly.</span>
    </div>`;
  } else if (status === 'fully_executed') {
    html += `<div class="agr-status" style="margin-top:16px">
      <span data-en="The agreement is fully executed. Both parties have signed." data-zh="合同已完全生效，双方均已签署。">The agreement is fully executed. Both parties have signed.</span>
    </div>`;
  }

  // Bilingual note
  html += `<div class="bilingual-note">
    <span data-en="Note: The English version is the legally binding text. The Chinese version is provided for reference only." data-zh="注意：英文版为法律约束文本，中文版仅供参考。">Note: The English version is the legally binding text. The Chinese version is provided for reference only.</span>
  </div>`;

  html += `</div>`;

  // State machine visual
  html += `<div class="state-machine">`;
  states.forEach((s, i) => {
    const cls = i < currentIdx ? 'done' : i === currentIdx ? 'active' : '';
    html += `<span class="state-step ${cls}">${stateLabels[s]}</span>`;
    if (i < states.length - 1) html += `<span class="state-arrow">→</span>`;
  });
  html += `</div>`;

  document.getElementById('mainContent').innerHTML = html;
}

function goSign() {
  // Will be implemented in Phase 3 when sign_url is available
  alert('Sign URL will be available after Phase 3 implementation.');
}

function switchProject() {
  currentProjectId = parseInt(document.getElementById('projectSelect').value);
  loadAgreement();
}

function doLogout() {
  fetch(API + '/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
  localStorage.removeItem('portal_token');
  window.location.href = 'login.html';
}

let lang = localStorage.getItem('portal_lang') || 'en';
function applyLang() {
  if (lang === 'zh') { document.body.classList.remove('lang-en'); document.body.classList.add('lang-zh'); document.getElementById('langBtn').textContent = 'EN'; }
  else { document.body.classList.remove('lang-zh'); document.body.classList.add('lang-en'); document.getElementById('langBtn').textContent = '中文'; }
}
function toggleLang() {
  lang = lang === 'en' ? 'zh' : 'en';
  localStorage.setItem('portal_lang', lang);
  applyLang();
  loadAgreement();
}
applyLang();
checkAuth();
</script>
</body>
</html>
