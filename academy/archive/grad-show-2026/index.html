<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta name="robots" content="noindex">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蜗牛AI · 第1期毕业展览日 · 项目看板</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐌</text></svg>">
<style>
/* ── Dark Theme (default) ── */
:root, [data-theme="dark"] {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3348;
  --text: #e8eaed;
  --text2: #9aa0b0;
  --accent: #d97757;
  --accent-dim: #3a2218;
  --green: #5dcaa5;
  --green-dim: #1d4e3e;
  --blue: #85b7eb;
  --blue-dim: #1a3a5c;
  --amber: #fac775;
  --amber-dim: #4a3a10;
  --red: #f09595;
  --red-dim: #4a1a1a;
  --purple: #afa9ec;
  --purple-dim: #2a2650;
  --card-shadow: 0 2px 8px rgba(0,0,0,.3);
  --countdown-bg: linear-gradient(135deg, var(--accent-dim), var(--surface));
}

/* ── Light Theme ── */
[data-theme="light"] {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface2: #eef0f4;
  --border: #d8dbe5;
  --text: #1a1d27;
  --text2: #6b7280;
  --accent: #c75a3a;
  --accent-dim: #fde8e0;
  --green: #16a07a;
  --green-dim: #d4f5e9;
  --blue: #2563eb;
  --blue-dim: #dbeafe;
  --amber: #b45309;
  --amber-dim: #fef3c7;
  --red: #dc2626;
  --red-dim: #fee2e2;
  --purple: #7c3aed;
  --purple-dim: #ede9fe;
  --card-shadow: 0 2px 8px rgba(0,0,0,.08);
  --countdown-bg: linear-gradient(135deg, var(--accent-dim), var(--surface));
}

* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif; font-size:13px; line-height:1.5; min-height:100vh; transition: background .3s, color .3s; }
.container { max-width:480px; margin:0 auto; padding:16px; }

/* Theme toggle */
.theme-toggle { position:fixed; top:12px; right:12px; z-index:100; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:4px 10px; cursor:pointer; font-size:16px; box-shadow:var(--card-shadow); transition: all .2s; line-height:1; }
.theme-toggle:hover { border-color:var(--accent); }

/* Header */
.hero { text-align:center; margin-bottom:20px; }
.hero img { height:56px; margin-bottom:8px; }
.hero h1 { font-size:20px; font-weight:700; letter-spacing:-0.3px; }
.hero .tagline { color:var(--text2); font-size:12px; margin-top:2px; }

/* Countdown */
.countdown-card { background:var(--countdown-bg); border:1px solid var(--accent); border-radius:12px; padding:16px; text-align:center; margin-bottom:16px; box-shadow:var(--card-shadow); }
.countdown-number { font-size:48px; font-weight:800; color:var(--accent); line-height:1; }
.countdown-label { font-size:12px; color:var(--text2); margin-top:4px; }
.countdown-date { font-size:11px; color:var(--text2); margin-top:6px; }
.countdown-date span { color:var(--amber); font-weight:600; }

/* Overall progress */
.overall-progress { margin-bottom:16px; }
.overall-bar { height:8px; background:var(--surface2); border-radius:4px; overflow:hidden; }
.overall-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--green)); border-radius:4px; transition:width .5s ease; }
.overall-text { font-size:12px; color:var(--text2); margin-top:4px; display:flex; justify-content:space-between; }

/* Workstream card */
.ws-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:10px; transition:border-color .2s, box-shadow .2s; box-shadow:var(--card-shadow); }
.ws-card:hover { border-color:var(--accent); }
.ws-card.all-done { border-color:var(--green); opacity:.85; }
.ws-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.ws-num { font-size:11px; font-weight:700; padding:2px 8px; border-radius:4px; color:#fff; min-width:28px; text-align:center; }
.ws-title { font-size:14px; font-weight:500; flex:1; }
.ws-badge { font-size:11px; padding:2px 7px; border-radius:4px; }
.badge-pending { background:var(--surface2); color:var(--text2); }
.badge-active { background:var(--amber-dim); color:var(--amber); }
.badge-done { background:var(--green-dim); color:var(--green); }

/* Progress mini-bar */
.ws-bar { height:3px; background:var(--surface2); border-radius:2px; margin-bottom:8px; overflow:hidden; }
.ws-bar-fill { height:100%; border-radius:2px; transition:width .3s; }

/* Task list in card */
.task-item { display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-bottom:1px solid var(--border); }
.task-item:last-child { border-bottom:none; }
.task-status { width:14px; height:14px; border-radius:50%; flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center; font-size:9px; }
.task-status.pending { background:var(--surface2); border:1px solid var(--border); }
.task-status.in_progress { background:var(--amber-dim); border:1px solid var(--amber); color:var(--amber); }
.task-status.done { background:var(--green); color:#fff; }
.task-body { flex:1; min-width:0; }
.task-title { font-size:12px; font-weight:500; color:var(--text); }
.task-title.done-text { text-decoration:line-through; text-decoration-color:var(--text2); color:var(--text2); }
.task-meta { display:flex; gap:6px; align-items:center; margin-top:2px; flex-wrap:wrap; }
.task-assignee { font-size:11px; color:var(--blue); background:var(--blue-dim); padding:1px 6px; border-radius:3px; }
.task-deadline { font-size:11px; color:var(--text2); }
.task-deadline.urgent { color:var(--red); }
.task-priority { font-size:10px; padding:1px 5px; border-radius:3px; }
.priority-urgent { background:var(--red-dim); color:var(--red); }
.priority-high { background:var(--amber-dim); color:var(--amber); }
.priority-normal { background:var(--surface2); color:var(--text2); }

/* Risk section */
.section-title { font-size:12px; font-weight:600; color:var(--text2); margin:16px 0 8px; text-transform:uppercase; letter-spacing:1px; }
.risk-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:6px; box-shadow:var(--card-shadow); }
.risk-card .risk-title { font-size:12px; font-weight:500; color:var(--red); margin-bottom:2px; }
.risk-card .risk-action { font-size:11px; color:var(--text2); }

/* Login CTA */
.login-cta { margin-top:20px; text-align:center; padding:16px; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--card-shadow); }
.login-cta p { font-size:12px; color:var(--text2); margin-bottom:10px; }
.login-btn { display:inline-block; padding:8px 24px; background:var(--accent); color:#fff; border-radius:6px; text-decoration:none; font-size:13px; font-weight:600; transition:opacity .2s; }
.login-btn:hover { opacity:.85; }

/* Footer */
.footer { margin-top:16px; padding-top:12px; border-top:1px solid var(--border); font-size:11px; color:var(--text2); text-align:center; }

/* Loading */
.loading { text-align:center; padding:40px 0; color:var(--text2); }
.loading .spinner { display:inline-block; width:24px; height:24px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Refresh hint */
.refresh-hint { font-size:11px; color:var(--text2); text-align:center; margin-bottom:12px; cursor:pointer; }
.refresh-hint:hover { color:var(--accent); }

/* Responsive */
@media (min-width:768px) {
  .container { max-width:560px; }
}
</style>
</head>
<body>

<!-- Theme toggle -->
<div class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换亮/暗色">🌙</div>

<div class="container">
  <div class="hero">
    <img src="/assets/snailai_logo.png" alt="蜗牛AI" style="height:56px;margin-bottom:8px;">
    <h1>第1期毕业展览日</h1>
    <div class="tagline">Graduation Showcase Day · Season 1</div>
  </div>

  <!-- Countdown -->
  <div class="countdown-card">
    <div class="countdown-number" id="countdownDays">--</div>
    <div class="countdown-label">天</div>
    <div class="countdown-date">2026年9月26日 周六 · <span>Killara Golf Club</span></div>
  </div>

  <!-- Overall progress -->
  <div class="overall-progress">
    <div class="overall-bar"><div class="overall-fill" id="overallFill" style="width:0%"></div></div>
    <div class="overall-text">
      <span id="overallLabel">加载中...</span>
      <span id="overallPct">0%</span>
    </div>
  </div>

  <!-- Refresh hint -->
  <div class="refresh-hint" onclick="loadBoard()">🔄 点击刷新</div>

  <!-- Workstream cards (dynamically filled) -->
  <div id="boardContent">
    <div class="loading"><div class="spinner"></div><p style="margin-top:8px">加载看板数据...</p></div>
  </div>

  <!-- Risks -->
  <div class="section-title">⚠️ 风险关注</div>
  <div id="risksContainer">
    <div class="risk-card">
      <div class="risk-title">场地确认</div>
      <div class="risk-action">KGC 场地预订待确认（Renee 本周处理），WiFi/电源待书面确认</div>
    </div>
    <div class="risk-card">
      <div class="risk-title">WorkBuddy 国际版</div>
      <div class="risk-action">未试用澳洲信用卡安装流程，9/5 前必须完成</div>
    </div>
  </div>

  <!-- Login CTA -->
  <div class="login-cta">
    <p>你是项目参与者？登录后可更新自己负责的任务进度</p>
    <a href="/tasks/board.html" class="login-btn">登录更新进度 →</a>
  </div>

  <div class="footer">
    蜗牛AI · 项目协同看板 V1.0<br>
    数据实时同步 · 无需手动刷新
  </div>
</div>

<script>
const PROJECT_ID = 1;
const API_BASE = '/api/internal-tasks';
const TARGET_DATE = new Date('2026-09-26T13:00:00+10:00');

// ── Theme toggle ──
function getStoredTheme() {
  return localStorage.getItem('board-theme') || 'light';
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  btn.textContent = theme === 'dark' ? '🌙' : '☀️';
  btn.title = theme === 'dark' ? '切换到亮色' : '切换到暗色';
  localStorage.setItem('board-theme', theme);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}
// Init theme
applyTheme(getStoredTheme());

// Countdown
function updateCountdown() {
  const now = new Date();
  const diff = TARGET_DATE - now;
  const days = Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
  document.getElementById('countdownDays').textContent = days;
}

// Status helpers
const STATUS_MAP = {
  'pending': { label: '待开始', cls: 'pending', icon: '' },
  'in_progress': { label: '进行中', cls: 'in_progress', icon: '▶' },
  'done': { label: '完成', cls: 'done', icon: '✓' },
  'submitted': { label: '已提交', cls: 'in_progress', icon: '📤' },
  'approved': { label: '已审批', cls: 'done', icon: '✓' },
  'revision': { label: '返修', cls: 'in_progress', icon: '🔄' },
};

function statusInfo(s) { return STATUS_MAP[s] || STATUS_MAP['pending']; }

function isUrgent(deadline) {
  if (!deadline) return false;
  const d = new Date(deadline);
  const now = new Date();
  return d - now < 7 * 24 * 60 * 60 * 1000;
}

function isOverdue(deadline) {
  if (!deadline) return false;
  return new Date(deadline) < new Date();
}

function formatDate(ds) {
  if (!ds) return '';
  const d = new Date(ds);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

// Render workstream cards
function renderBoard(data) {
  const proj = data.project;
  const workstreams = data.workstreams;

  const pct = proj.progress || 0;
  document.getElementById('overallFill').style.width = pct + '%';
  document.getElementById('overallPct').textContent = pct + '%';
  document.getElementById('overallLabel').textContent = `总进度：${proj.done_tasks || 0} / ${proj.total_tasks || 0} 任务完成`;

  const wsKeys = Object.keys(workstreams).sort((a, b) => {
    const na = parseInt(a.match(/\d+/)?.[0] || '99');
    const nb = parseInt(b.match(/\d+/)?.[0] || '99');
    return na - nb;
  });

  let html = '';
  for (const ws of wsKeys) {
    const tasks = workstreams[ws];
    const doneCount = tasks.filter(t => t.status === 'done' || t.status === 'approved').length;
    const total = tasks.length;
    const wsPct = total > 0 ? Math.round(doneCount / total * 100) : 0;
    const allDone = doneCount === total && total > 0;
    const anyActive = tasks.some(t => t.status === 'in_progress' || t.status === 'submitted' || t.status === 'revision');

    const wsNum = parseInt(ws.match(/\d+/)?.[0] || '0');
    const colors = ['var(--accent)', 'var(--purple)', 'var(--blue)', 'var(--amber)', 'var(--green)', 'var(--accent)', 'var(--red)'];
    const wsColor = colors[wsNum % colors.length];

    let badgeCls = 'badge-pending';
    let badgeLabel = '待开始';
    if (allDone) { badgeCls = 'badge-done'; badgeLabel = '已完成'; }
    else if (anyActive) { badgeCls = 'badge-active'; badgeLabel = '进行中'; }

    html += `<div class="ws-card${allDone ? ' all-done' : ''}">`;
    html += `<div class="ws-header">`;
    html += `<span class="ws-num" style="background:${wsColor}">${wsNum}</span>`;
    html += `<span class="ws-title">${ws.replace(/^线\d+\s*/, '')}</span>`;
    html += `<span class="ws-badge ${badgeCls}">${badgeLabel}</span>`;
    html += `</div>`;
    html += `<div class="ws-bar"><div class="ws-bar-fill" style="width:${wsPct}%;background:${wsColor}"></div></div>`;

    for (const t of tasks) {
      const si = statusInfo(t.status);
      const titleCls = (t.status === 'done' || t.status === 'approved') ? 'task-title done-text' : 'task-title';
      const dlCls = isOverdue(t.deadline) ? 'task-deadline urgent' : (isUrgent(t.deadline) ? 'task-deadline urgent' : 'task-deadline');
      const priCls = t.priority === 'urgent' ? 'priority-urgent' : (t.priority === 'high' ? 'priority-high' : 'priority-normal');

      html += `<div class="task-item">`;
      html += `<div class="task-status ${si.cls}">${si.icon}</div>`;
      html += `<div class="task-body">`;
      html += `<div class="${titleCls}">${t.title}</div>`;
      html += `<div class="task-meta">`;
      html += `<span class="task-assignee">${t.assigned_to_name || t.assigned_to}</span>`;
      if (t.deadline) html += `<span class="${dlCls}">📅 ${formatDate(t.deadline)}</span>`;
      if (t.priority && t.priority !== 'normal') html += `<span class="task-priority ${priCls}">${t.priority === 'urgent' ? '紧急' : '高'}</span>`;
      html += `</div></div></div>`;
    }
    html += `</div>`;
  }

  document.getElementById('boardContent').innerHTML = html;
}

// Load data from API
async function loadBoard() {
  try {
    const resp = await fetch(`${API_BASE}/projects/${PROJECT_ID}/public`);
    if (!resp.ok) throw new Error('API error: ' + resp.status);
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'Unknown error');
    renderBoard(data);
  } catch (e) {
    document.getElementById('boardContent').innerHTML =
      `<div style="text-align:center;padding:20px;color:var(--red)">加载失败: ${e.message}<br><span style="color:var(--text2);cursor:pointer" onclick="loadBoard()">重试</span></div>`;
  }
}

// Init
updateCountdown();
loadBoard();
setInterval(loadBoard, 60000);
</script>
</body>
</html>
