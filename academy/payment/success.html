<!DOCTYPE html>
<html lang="zh-CN" data-title-zh="报名成功 - 蜗牛 AI" data-title-en="Enrollment Success - Snail AI">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-zh="报名成功 - 蜗牛 AI" data-en="Enrollment Success - Snail AI">报名成功 - 蜗牛 AI</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    .pay-success-wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--paper); padding: 24px;
    }
    .pay-success-card {
      max-width: 480px; width: 100%;
      text-align: center;
      padding: 48px 32px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .success-icon {
      font-size: 3.5rem; margin-bottom: 20px;
    }
    .success-title {
      font-size: 1.5rem; font-weight: 800; color: var(--ink); margin-bottom: 8px;
    }
    .success-subtitle {
      font-size: 0.95rem; color: var(--ink-3); margin-bottom: 28px;
    }
    .success-detail {
      background: var(--paper-2); border-radius: 12px; padding: 18px 22px;
      text-align: left; margin-bottom: 28px;
    }
    .detail-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; font-size: 0.88rem;
    }
    .detail-row:not(:last-child) { border-bottom: 1px solid var(--line); }
    .detail-label { color: var(--ink-3); }
    .detail-value { font-weight: 700; color: var(--ink); }
    .btn-home {
      display: inline-block;
      padding: 12px 32px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 100px;
      font-size: 0.92rem; font-weight: 800;
      cursor: pointer; text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-home:hover { background: var(--accent-2); transform: translateY(-1px); }
    .error-card { border-color: #e74c3c; }
    .error-icon { color: #e74c3c; }
    @media (max-width: 520px) {
      .pay-success-card { padding: 36px 22px; }
      .success-title { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="pay-success-wrap">
    <div class="pay-success-card" id="card">
      <!-- Content filled by JS -->
      <div class="success-icon" id="icon">✅</div>
      <h1 class="success-title" id="title" data-zh="报名成功！" data-en="Enrollment Successful!">报名成功！</h1>
      <p class="success-subtitle" id="subtitle" data-zh="感谢加入蜗牛 AI，我们已收到您的付款。" data-en="Thank you for joining Snail AI. Payment received.">感谢加入蜗牛 AI，我们已收到您的付款。</p>
      <div class="success-detail" id="details">
        <div class="detail-row">
          <span class="detail-label" data-zh="课程" data-en="Course">课程</span>
          <span class="detail-value" id="d-course">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label" data-zh="金额" data-en="Amount">金额</span>
          <span class="detail-value" id="d-amount">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label" data-zh="收据编号" data-en="Receipt No.">收据编号</span>
          <span class="detail-value" id="d-receipt" style="font-family:var(--mono);font-size:0.8rem;">—</span>
        </div>
      </div>
      <a href="/" class="btn-home" data-zh="返回首页" data-en="Back to Home">返回首页</a>
    </div>
  </div>

<script>
  // Course info map
  const COURSE_INFO = {
    online:  { zh: 'AI 应用线上课', en: 'AI Application Online Course',  amount: 'AUD $999' },
    wealth:  { zh: 'AI 财富管理线下课', en: 'AI Wealth Management Offline', amount: 'AUD $1,999' },
  };

  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id') || '';
  const course = params.get('course') || '';
  const card = document.getElementById('card');
  const icon = document.getElementById('icon');
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');

  if (sessionId && course && COURSE_INFO[course]) {
    const info = COURSE_INFO[course];
    document.getElementById('d-course').textContent = info.zh;
    document.getElementById('d-amount').textContent = info.amount;
    document.getElementById('d-receipt').textContent = sessionId.slice(0, 20) + '...';
  } else {
    // Error state
    icon.textContent = '⚠️';
    icon.classList.add('error-icon');
    title.textContent = title.getAttribute('data-zh') === '报名成功！' ? '无法确认付款状态' : 'Cannot verify payment';
    subtitle.textContent = subtitle.getAttribute('data-zh').includes('感谢') ? '请检查付款状态或联系我们。' : 'Please check your payment or contact us.';
    card.classList.add('error-card');
    document.getElementById('details').style.display = 'none';
  }

  // Language switcher (simple)
  const LANG_KEY = 'snailai-lang';
  let savedLang = 'zh';
  try { savedLang = localStorage.getItem(LANG_KEY) || 'zh'; } catch(e) {}
  if (savedLang !== 'zh') {
    document.querySelectorAll('[data-en]').forEach(el => {
      if (el.hasAttribute('data-zh')) el.textContent = el.getAttribute('data-' + savedLang);
    });
  }
</script>
</body>
</html>
